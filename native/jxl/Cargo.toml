# WASM decoder for pixmix: jxl-oxide with raw-pixel output and JPEG reconstruction.
# Build with scripts/build-jxl-wasm.sh (needs rustup's wasm32 target and wasm-bindgen-cli);
# the output in native/jxl/pkg is committed so nobody else needs a Rust toolchain.

[package]
name = "pixmix-jxl"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.128"

[dependencies.jxl-oxide]
version = "=0.12.6"
default-features = false
features = ["moxcms"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
