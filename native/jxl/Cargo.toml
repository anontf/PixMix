# WASM decoder for pixmix: jxl-oxide with raw-pixel output and JPEG reconstruction.
# Build with scripts/build-jxl-wasm.sh (needs rustup's wasm32 target and wasm-bindgen-cli);
# the output in native/jxl/pkg is committed so nobody else needs a Rust toolchain.

[package]
name = "pixmix-jxl"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.128"

[dependencies.jxl-oxide]
version = "=0.12.6"
default-features = false
features = ["moxcms"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# jxl-jbr 0.2.1 with its JPEG writer fixed to match libjxl's reference one
# (lib/jxl/jpeg/dec_jpeg_data_writer.cc); every change is marked "pixmix patch":
# - COM segments were rebuilt with their marker byte written twice;
# - 4:4:4 JPEGs stored with sampling factors other than 1x1 lost chroma-from-luma;
# - scans were written on the wrong MCU/block grid (non-interleaved scans of subsampled
#   components: progressive 4:2:0, one scan per component, >10 blocks per MCU), and
#   progressive EOB runs, refinement zero runs and padding bits differed from libjxl
#   (patches/jxl-jbr/src/reconstruct/scan.rs is a port of libjxl's scan writer);
# - quant tables were matched to components by DQT index instead of by position.
[patch.crates-io]
jxl-jbr = { path = "patches/jxl-jbr" }
