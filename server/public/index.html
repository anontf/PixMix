<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pixmix lab</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>pixmix lab</h1>
  <nav><a href="/" aria-current="page">Lab</a><a href="/site.html">Demo site</a></nav>
</header>
<main>
  <section class="controls">
    <label>Image
      <div class="row"><input type="file" id="file" accept="image/*">
        <button id="sample">Sample</button>
        <select id="sampleType" aria-label="Sample format"><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option></select></div>
    </label>
    <label>Key <input id="key" value="correct horse battery staple" size="26"></label>
    <label>Mode
      <select id="mode"><option value="pixel">pixel</option><option value="block">block</option></select>
    </label>
    <label>Block <input type="number" id="block" value="16" min="2" max="512"></label>
    <label>Encode on
      <select id="where"><option value="server">server (Node)</option><option value="browser">browser</option></select>
    </label>
    <button class="primary" id="encode" disabled>Encode</button>
  </section>

  <div class="grid">
    <div class="card">
      <h2>Original <span id="origSize"></span></h2>
      <div class="stage" id="origStage"></div>
      <div class="meta" id="origMeta">Pick an image or use the sample.</div>
    </div>
    <div class="card">
      <h2>Scrambled <span id="scrSize"></span></h2>
      <div class="stage" id="scrStage"></div>
      <div class="meta" id="scrMeta">What any viewer shows.</div>
    </div>
    <div class="card">
      <h2>Decoded in browser <span id="decTime"></span></h2>
      <div class="stage" id="decStage"></div>
      <div class="progress"><i id="bar"></i></div>
      <div class="meta" id="decMeta"></div>
    </div>
  </div>

  <section class="controls" style="margin-top:16px">
    <label>Decode key <input id="decKey" placeholder="same as key" size="26"></label>
    <label>Effect
      <select id="effect"><option>dissolve</option><option>scan</option><option>blocks</option><option>none</option></select>
    </label>
    <label>Duration ms <input type="number" id="duration" value="1600" min="0" step="100"></label>
    <button class="primary" id="replay" disabled>Decode again</button>
    <label>New key <input id="newKey" placeholder="rotate to…" size="18"></label>
    <button id="rekey" disabled>Rekey</button>
    <button id="publish" disabled>Publish to demo site</button>
    <span class="meta" id="pubMeta"></span>
  </section>

  <div class="grid">
    <div class="card">
      <h2>Chunks: original → scrambled</h2>
      <div id="chunks" class="meta">–</div>
    </div>
  </div>
</main>

<script type="module">
import * as Enc from '/dist/pixmix-encoder.mjs';
import * as Dec from '/dist/pixmix-decoder.js';

const $ = (id) => document.getElementById(id);
const kib = (n) => n < 1024 * 1024 ? `${(n / 1024).toFixed(1)} KiB` : `${(n / 1048576).toFixed(2)} MiB`;
const ms = (t) => `${t.toFixed(0)} ms`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`);
const blobUrl = (bytes, type = 'image/png') => URL.createObjectURL(new Blob([bytes], { type }));
const browserDecoders = [Enc.browserDecoder()];
let original = null, originalName = 'sample', scrambled = null, activeKey = null;
let reference = null; // original as PNG: the input itself, or its conversion

function showImage(stageId, bytes, type) {
  const img = new Image();
  img.src = blobUrl(bytes, type);
  $(stageId).replaceChildren(img);
  return img;
}

async function loadOriginal(bytes, name, note = '') {
  original = bytes;
  originalName = name;
  scrambled = null;
  reference = null;
  const format = Enc.detectFormat(bytes);
  showImage('origStage', bytes, format ? `image/${format}` : '');
  $('origSize').textContent = kib(bytes.length);
  let info;
  try {
    info = Enc.inspect(bytes);
  } catch (err) {
    $('origMeta').innerHTML = `<span class="bad">${esc(err.message)}</span>`;
    $('encode').disabled = true;
    return;
  }
  const parts = [`<b>${info.format.toUpperCase()}</b>`];
  if (info.width) parts.push(`${info.width}×${info.height}`);
  if (info.format === 'png') {
    parts.push(`depth ${info.bitDepth} · colour type ${info.colorType}${info.interlaced ? ' · interlaced' : ''}`);
    if (info.scrambled) parts.push('<span class="bad">already scrambled</span>');
  } else if (info.metadata) {
    parts.push(`metadata: ${info.metadata.join(', ') || 'none'}${info.orientation > 1 ? ` · orientation ${info.orientation}` : ''}`);
  }
  $('origMeta').innerHTML = parts.join(' · ') + note;
  for (const id of ['scrStage', 'decStage']) $(id).replaceChildren();
  for (const id of ['scrMeta', 'decMeta', 'scrSize', 'decTime', 'chunks', 'pubMeta']) $(id).textContent = '';
  $('encode').disabled = false;
  for (const id of ['replay', 'rekey', 'publish']) $(id).disabled = true;
}

$('file').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (file) loadOriginal(new Uint8Array(await file.arrayBuffer()), file.name);
});

$('sample').addEventListener('click', async () => {
  const w = 960, h = 640;
  const c = new OffscreenCanvas(w, h);
  const g = c.getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#1b2a6b'); sky.addColorStop(0.55, '#e0668a'); sky.addColorStop(1, '#ffc46b');
  g.fillStyle = sky; g.fillRect(0, 0, w, h);
  g.fillStyle = '#fff3c4'; g.beginPath(); g.arc(w * 0.68, h * 0.5, 110, 0, Math.PI * 2); g.fill();
  for (let i = 0; i < 4; i++) {
    g.fillStyle = ['#2d1b4e', '#3b2160', '#4a2a6e', '#20123a'][i];
    g.beginPath(); g.moveTo(0, h);
    for (let x = 0; x <= w; x += 40) g.lineTo(x, h * (0.62 + i * 0.09) + Math.sin(x / (90 + i * 30) + i) * 40);
    g.lineTo(w, h); g.fill();
  }
  g.fillStyle = '#fff'; g.font = 'bold 96px system-ui'; g.fillText('pixmix', 48, 130);
  g.font = '28px system-ui'; g.fillText('scrambled, valid, reversible', 52, 176);
  const type = $('sampleType').value;
  const blob = await c.convertToBlob({ type, quality: 0.9 });
  loadOriginal(new Uint8Array(await blob.arrayBuffer()), `sample.${type.split('/')[1]}`, ' · generated sample');
});

async function serverCall(path, params, bytes) {
  const res = await fetch(`${path}?${new URLSearchParams(params)}`, { method: 'POST', body: bytes });
  if (!res.ok) throw new Error((await res.json()).error);
  const convert = res.headers.get('X-Pixmix-Convert');
  return { bytes: new Uint8Array(await res.arrayBuffer()), report: convert ? JSON.parse(convert) : null };
}

function encodeOpts() {
  const o = { key: $('key').value, mode: $('mode').value };
  if (o.mode === 'block') o.block = Number($('block').value);
  return o;
}

$('encode').addEventListener('click', async () => {
  const opts = encodeOpts();
  const where = $('where').value;
  const t0 = performance.now();
  let report;
  try {
    if (where === 'server') {
      ({ bytes: scrambled, report } = await serverCall('/api/encode', opts, original));
    } else {
      scrambled = await Enc.encodeAsync(original, { ...opts, decoders: browserDecoders, onConvert: (r) => { report = r; } });
      reference = report.png;
    }
    // Reference for verification: the PNG input itself, or a browser-side conversion of it.
    reference ??= Enc.detectFormat(original) === 'png'
      ? original
      : (await Enc.convertAsync(original, { decoders: browserDecoders })).png;
  } catch (err) {
    $('scrMeta').innerHTML = `<span class="bad">${esc(err.message)}</span>`;
    return;
  }
  activeKey = opts.key;
  showScrambled(`encoded on ${where} in ${ms(performance.now() - t0)}`, report);
  await runDecode();
});

function describe(report) {
  if (!report || report.from === 'png') return '';
  const bits = [`converted from <b>${report.from}</b> via ${report.decoder}`];
  bits.push(`kept: ${report.transferred.length ? report.transferred.join(', ') : 'no metadata'}`);
  if (report.dropped.length) bits.push(`<span class="bad">dropped: ${esc(report.dropped.join(', '))}</span>`);
  return `<br>${bits.join(' · ')}`;
}

function showScrambled(note, report) {
  showImage('scrStage', scrambled);
  const info = Enc.inspect(scrambled);
  $('scrSize').textContent = `${kib(scrambled.length)} (${(scrambled.length / original.length).toFixed(2)}×)`;
  $('scrMeta').innerHTML = `${note} · mode <b>${info.mode}${info.block ? ` ${info.block}px` : ''}</b> · ` +
    `<a download="scrambled.png" href="${blobUrl(scrambled)}">download</a>${describe(report)}`;
  renderChunks(Enc.inspect(reference).chunks, info.chunks, Enc.detectFormat(original) !== 'png');
  for (const id of ['replay', 'rekey', 'publish']) $(id).disabled = false;
}

async function runDecode() {
  const url = blobUrl(scrambled);
  const img = new Image();
  img.src = url;
  img.dataset.pixmixSrc = url;
  $('decStage').replaceChildren(img);
  $('decMeta').textContent = 'decoding…';
  $('bar').style.width = '0';
  const key = $('decKey').value || activeKey;
  const t0 = performance.now();
  try {
    await Dec.reveal(img, {
      key,
      effect: $('effect').value,
      duration: Number($('duration').value),
      onProgress: (p) => { $('bar').style.width = `${p * 100}%`; },
    });
  } catch (err) {
    $('decMeta').innerHTML = `<span class="bad">${esc(err.name)}: ${esc(err.message)}</span>`;
    return;
  }
  $('decTime').textContent = ms(performance.now() - t0);
  $('decMeta').innerHTML = await verify();
}

async function rgba(bytes) {
  const bmp = await createImageBitmap(new Blob([bytes], { type: 'image/png' }), {
    premultiplyAlpha: 'none', colorSpaceConversion: 'none', imageOrientation: 'none',
  });
  const c = new OffscreenCanvas(bmp.width, bmp.height);
  const g = c.getContext('2d');
  g.drawImage(bmp, 0, 0);
  return g.getImageData(0, 0, bmp.width, bmp.height).data;
}

async function verify() {
  const key = $('decKey').value || activeKey;
  const restored = await Dec.decodeAsync(scrambled, { key });
  const [a, b] = await Promise.all([rgba(reference), rgba(restored)]);
  let diff = 0, maxDelta = 0;
  for (let i = 0; i < a.length; i++) {
    const d = Math.abs(a[i] - b[i]);
    if (d) { diff++; if (d > maxDelta) maxDelta = d; }
  }
  const meta = (png) => JSON.stringify(Enc.inspect(png).chunks.filter((c) => c.type !== 'IDAT' && c.type !== 'pmIx'));
  const sameMeta = meta(reference) === meta(restored);
  const vs = Enc.detectFormat(original) === 'png' ? 'original' : 'browser-side conversion of the original';
  const pixelsLine = a.length !== b.length ? '<span class="bad">✗ size differs</span>'
    : diff === 0 ? `<span class="ok">✓ pixel-identical to the ${vs}</span>`
    : `<span class="bad">≈ ${diff} samples differ (max Δ ${maxDelta}) from the ${vs}: server and browser decoded the lossy source differently</span>`;
  return `${pixelsLine} · ${sameMeta ? '<span class="ok">✓ metadata chunks identical</span>' : '<span class="bad">✗ chunks differ</span>'}` +
    ` · restored ${kib(restored.length)} · <a download="restored.png" href="${blobUrl(restored)}">download</a>`;
}

function renderChunks(before, after, converted) {
  const fmt = (list) => {
    const out = [];
    for (const c of list) {
      const last = out.at(-1);
      if (last && last.type === c.type && c.type === 'IDAT') { last.n++; last.length += c.length; }
      else out.push({ ...c, n: 1 });
    }
    return out;
  };
  const a = fmt(before), b = fmt(after);
  const rows = [];
  for (let i = 0, j = 0; i < a.length || j < b.length;) {
    if (b[j]?.type === 'pmIx') { rows.push([null, b[j], true]); j++; continue; }
    rows.push([a[i], b[j], false]); i++; j++;
  }
  const cell = (c) => c ? `${c.type}${c.n > 1 ? ` ×${c.n}` : ''}</td><td>${c.length.toLocaleString()} B` : '</td><td>';
  $('chunks').innerHTML = `<table><tr><th>${converted ? 'converted' : 'original'}</th><th>size</th><th>scrambled</th><th>size</th></tr>` +
    rows.map(([x, y, added]) => `<tr class="${added ? 'added' : ''}"><td>${cell(x)}</td><td>${cell(y)}</td></tr>`).join('') +
    `</table><p>Every chunk except IDAT is copied byte for byte; <b>pmIx</b> carries the version, mode and salt.` +
    `${converted ? ' The left column is the input after conversion to PNG, with its metadata mapped to PNG chunks.' : ''}</p>`;
}

$('replay').addEventListener('click', runDecode);

$('rekey').addEventListener('click', async () => {
  const to = $('newKey').value;
  if (!to) return $('newKey').focus();
  const opts = { from: activeKey, to, mode: $('mode').value };
  if (opts.mode === 'block') opts.block = Number($('block').value);
  const t0 = performance.now();
  try {
    scrambled = $('where').value === 'server' ? (await serverCall('/api/rekey', opts, scrambled)).bytes : Enc.rekey(scrambled, opts);
  } catch (err) {
    $('scrMeta').innerHTML = `<span class="bad">${esc(err.message)}</span>`;
    return;
  }
  activeKey = to;
  $('key').value = to;
  $('newKey').value = '';
  showScrambled(`re-keyed on ${$('where').value} in ${ms(performance.now() - t0)}`);
  await runDecode();
});

$('publish').addEventListener('click', async () => {
  const q = new URLSearchParams({ key: activeKey, effect: $('effect').value, name: originalName });
  const res = await fetch(`/api/gallery?${q}`, { method: 'POST', body: scrambled });
  const out = await res.json();
  $('pubMeta').innerHTML = res.ok ? `published → <a href="/site.html">demo site</a>` : `<span class="bad">${esc(out.error)}</span>`;
});
</script>
</body>
</html>
